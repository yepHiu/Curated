name: CD - Full, Server and Desktop

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      mode:
        type: string
        default: draft
  push:
    tags:
      - 'full-v*'
      - 'server-v*'
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing component tag (full-v, server-v or desktop-vMAJOR.MINOR.PATCH)
        required: true
        type: string
      mode:
        description: Keep a draft or publish after checks pass
        type: choice
        options:
          - draft
          - publish
        default: draft

permissions:
  contents: read

# Serialize tag and manual runs for the same version, including draft retries.
concurrency:
  group: curated-release-publication
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release source and notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      component: ${{ steps.release.outputs.component }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve immutable tag commit
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^(full|server|desktop)-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Expected a component tag: full-v, server-v or desktop-vMAJOR.MINOR.PATCH'
            exit 1
          fi
          commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$EVENT_NAME" == push && "$commit" != "$EVENT_SHA" ]]; then
            echo '::error::Tag no longer matches the triggering commit'
            exit 1
          fi
          git checkout --detach "$commit"
      - name: Validate version, notes and release availability
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release/component_cd.py check --tag "$RELEASE_TAG"

  quality:
    name: Check the exact release commit
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.prepare.outputs.commit }}

  build:
    name: Build Windows x64 packages
    needs: [prepare, quality]
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ env.RELEASE_ARTIFACT }}
    env:
      RELEASE_ARTIFACT: windows-release-${{ needs.prepare.outputs.tag }}-${{ github.run_attempt }}
      VITE_USE_WEB_API: 'true'
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install frontend and Electron dependencies
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # pnpm intentionally does not run Electron's install script implicitly.
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Windows packaging tools
        run: |
          if (!(Test-Path 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe') -and !(Test-Path 'C:/Program Files/Inno Setup 6/ISCC.exe')) {
            choco install innosetup --version=6.3.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          choco install ffmpeg --version=7.1.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ffmpeg = Get-ChildItem "$env:ChocolateyInstall/lib/ffmpeg" -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (!$ffmpeg) { throw 'Real FFmpeg executable not found' }
          $ffprobe = Join-Path $ffmpeg.DirectoryName 'ffprobe.exe'
          if (!(Test-Path $ffprobe)) { throw 'FFprobe executable not found' }
          $ffmpeg.DirectoryName >> $env:GITHUB_PATH
          & $ffmpeg.FullName -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe') -and !(Test-Path 'C:/Program Files/Inno Setup 6/ISCC.exe') -and !(Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            throw 'Inno Setup compiler not found'
          }
      - name: Build release with the tag version
        run: |
          python scripts/release/component_cd.py windows --tag "$env:RELEASE_TAG" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/component-build.log"
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:RUNNER_TEMP/component-build.log" -Tail 18 | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }
      - name: Exercise independent installers and Full composition
        run: |
          python scripts/release/windows_smoke.py --component "${{ needs.prepare.outputs.component }}" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/component-smoke.log"
          if ($LASTEXITCODE -ne 0) {
            python scripts/build/report-test-failure.py "$env:RUNNER_TEMP/component-smoke.log"
            exit 1
          }
      - name: Upgrade the real old all-in-one installation with Full
        if: needs.prepare.outputs.component == 'full'
        run: |
          python scripts/release/windows_legacy_smoke.py 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/legacy-smoke.log"
          if ($LASTEXITCODE -ne 0) {
            python scripts/build/report-test-failure.py "$env:RUNNER_TEMP/legacy-smoke.log"
            exit 1
          }
      - name: Upgrade the earlier all-in-one baseline with Full
        if: needs.prepare.outputs.component == 'full'
        run: |
          python scripts/release/windows_legacy_smoke.py --baseline 1.4.13
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Preserve verified distribution
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: release/windows-components/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
      - name: Preserve build ledger and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics-${{ needs.prepare.outputs.tag }}-${{ github.run_attempt }}
          path: |
            docs/ops/package-build-history.csv
            dist/bundle-analysis.json
            dist/bundle-report.md
          if-no-files-found: ignore
          retention-days: 90

  build-macos:
    name: Build Mac Desktop (Apple Silicon)
    if: needs.prepare.outputs.component != 'server'
    needs: [prepare, quality]
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ env.RELEASE_ARTIFACT }}
    env:
      RELEASE_ARTIFACT: macos-desktop-${{ needs.prepare.outputs.tag }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked Apple Silicon Electron runtime
        run: |
          test "$(uname -m)" = arm64
          pnpm install --frozen-lockfile
          node node_modules/electron/install.js
      - name: Build standalone Desktop DMG and ZIP
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python scripts/release/component_cd.py macos --tag "$RELEASE_TAG"
      - name: Verify packaged Mac Desktop starts without a Server
        run: |
          mkdir -p "$RUNNER_TEMP/mac-desktop-smoke"
          ditto -x -k release/macos-desktop/Curated-Desktop-*-macos-arm64.zip "$RUNNER_TEMP/mac-desktop-smoke"
          node scripts/release/desktop_smoke.cjs "$RUNNER_TEMP/mac-desktop-smoke/Curated Desktop.app/Contents/MacOS/Curated Desktop"
      - name: Verify previous Desktop profile and Server compatibility
        run: |
          python scripts/release/download_upgrade_baseline.py --platform macos --output "$RUNNER_TEMP/desktop-baseline"
          ditto -x -k "$RUNNER_TEMP/desktop-baseline/Curated-Desktop-0.1.0-macos-arm64.zip" "$RUNNER_TEMP/desktop-baseline/app"
          node scripts/release/desktop_upgrade_smoke.cjs "$RUNNER_TEMP/desktop-baseline/app/Curated Desktop.app/Contents/MacOS/Curated Desktop" "$RUNNER_TEMP/mac-desktop-smoke/Curated Desktop.app/Contents/MacOS/Curated Desktop"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: release/macos-desktop/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Upload and verify GitHub Release
    if: always() && needs.prepare.result == 'success' && needs.build.result == 'success' && (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped')
    needs: [prepare, build, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release/windows-components/
      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.component != 'server'
        with:
          name: ${{ needs.build-macos.outputs.artifact_name }}
          path: release/macos-desktop/
      - name: Publish verified assets (manual runs default to draft)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_MODE: ${{ inputs.mode || 'publish' }}
        run: |
          python scripts/release/component_cd.py stage --tag "$RELEASE_TAG"
          python scripts/release/component_cd.py publish --tag "$RELEASE_TAG" --mode "$RELEASE_MODE"
      - name: Preserve release manifests for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-release-${{ needs.prepare.outputs.tag }}-${{ github.run_attempt }}
          path: .workspace/component-cd/
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
