name: CI

on:
  workflow_call:
    inputs:
      source_ref:
        description: Immutable source commit supplied by CD
        required: true
        type: string
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend, Electron, and release scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Reject tracked local artifacts
        shell: bash
        run: |
          # Ignore rules alone do not remove files already in the Git index.
          tracked_ignored="$(git ls-files -ci --exclude-standard)"
          if [[ -n "$tracked_ignored" ]]; then
            echo "::error::Local artifacts are tracked. Remove them from the index with git rm --cached."
            printf '%s\n' "$tracked_ignored"
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run frontend unit tests
        env:
          NODE_OPTIONS: --no-experimental-webstorage
        run: pnpm test

      - name: Run Electron unit tests
        run: pnpm test:electron

      - name: Restore recent successful master bundle
        uses: actions/cache/restore@v4
        with:
          path: .workspace/bundle-baseline
          key: bundle-v2-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bundle-v2-${{ runner.os }}-

      - name: Build frontend
        env:
          VITE_USE_WEB_API: "true"
        run: pnpm build

      - name: Upload bundle size reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size-${{ inputs.source_ref || github.sha }}-${{ github.run_attempt }}
          path: |
            dist/bundle-analysis.json
            dist/bundle-report.md
          if-no-files-found: ignore
          retention-days: 90

      - name: Build Electron main process
        run: pnpm build:electron:main

      - name: Test release scripts
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Test release pipeline
        run: python -m unittest discover -s scripts/release/tests -p "test_*.py"

      - name: Prepare successful master bundle snapshot
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          mkdir -p .workspace/bundle-baseline
          cp dist/bundle-analysis.json .workspace/bundle-baseline/bundle-analysis.json

      - name: Save successful master bundle snapshot
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: .workspace/bundle-baseline
          key: bundle-v2-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

  backend-quality:
    name: Go test and vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run Go tests
        id: go-tests
        run: go test ./... 2>&1 | tee "$RUNNER_TEMP/go-tests.log"

      - name: Report failed Go tests
        if: failure() && steps.go-tests.outcome == 'failure'
        run: python ../scripts/build/report-test-failure.py "$RUNNER_TEMP/go-tests.log"

      - name: Run go vet
        run: go vet ./...

  runtime-e2e:
    name: Runtime browser e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run runtime e2e
        run: pnpm test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-runtime-diagnostics-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
