name: Build installers
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing server-v / desktop-v tag; builds verified standalone packages as a draft
        required: true
        type: string
permissions:
  contents: write
jobs:
  package:
    uses: ./.github/workflows/cd-release.yml
    with:
      tag: ${{ inputs.tag }}
      mode: draft
