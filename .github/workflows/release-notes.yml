name: Release notes
on:
  push:
    branches: [master]
    paths: ['docs/release-notes/full-v*.md', 'docs/release-notes/server-v*.md', 'docs/release-notes/desktop-v*.md']
  workflow_dispatch:
    inputs:
      tag:
        description: Published component tag whose description should match the repository notes
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: curated-release-publication
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update descriptions and verify unchanged release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python -m scripts.release.release_lib.sync_notes
