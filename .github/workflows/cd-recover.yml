name: CD - Recover verified release

on:
  push:
    branches: [master]
    paths: [scripts/release/recovery-request.json]
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed component CD run with both builds already verified
        required: true
        type: string
      mode:
        type: choice
        options: [draft, publish]
        default: draft

permissions:
  contents: write
  actions: read

concurrency:
  group: curated-release-publication
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate failed run and report bounded failure logs
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_RUN: ${{ inputs.run_id }}
          REQUEST_MODE: ${{ inputs.mode }}
        run: python scripts/release/recover_release.py
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.commit }}
          path: .workspace/release-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          name: ${{ steps.source.outputs.windows_artifact }}
          path: release/windows-components/
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.component != 'server'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          name: ${{ steps.source.outputs.macos_artifact }}
          path: release/macos-desktop/
      - name: Revalidate original artifacts and recover publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          RELEASE_MODE: ${{ steps.source.outputs.mode }}
          RELEASE_COMMAND: ${{ steps.source.outputs.command }}
        run: |
          set -o pipefail
          {
            python scripts/release/component_cd.py stage --tag "$RELEASE_TAG" --source-root .workspace/release-source
            python scripts/release/component_cd.py "$RELEASE_COMMAND" --tag "$RELEASE_TAG" --source-root .workspace/release-source --mode "$RELEASE_MODE"
          } 2>&1 | tee "$RUNNER_TEMP/recovery.log"
      - name: Report recovery failures
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/recovery.log"; then
            python scripts/build/report-test-failure.py "$RUNNER_TEMP/recovery.log"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-release-${{ github.run_id }}
          path: .workspace/component-cd/
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
