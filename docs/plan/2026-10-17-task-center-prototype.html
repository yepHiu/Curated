<script>
const $=s=>document.querySelector(s),icon=(n)=>`<svg class="icon" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const seed=[
 {id:'subtitle-01',kind:'subtitle',title:'AI 字幕识别与翻译',subject:'山间来信 · CD1',file:'DEMO-001.CD1.mp4',state:'running',stage:'翻译字幕',done:840,total:1260,unit:'条',created:'10:24',elapsed:'18 分 32 秒'},
 {id:'organize-01',kind:'organize',title:'AI 整理',subject:'未整理影片 · 300 部',state:'running',stage:'分类并应用标签',done:126,total:300,unit:'部',created:'10:31',elapsed:'11 分 08 秒'},
 {id:'subtitle-02',kind:'subtitle',title:'AI 字幕识别与翻译',subject:'夏日回声 · CD1',file:'DEMO-002.mp4',state:'queued',stage:'等待字幕处理通道',done:0,total:0,unit:'条',created:'10:39',elapsed:'尚未开始'},
 {id:'organize-02',kind:'organize',title:'AI 整理',subject:'已选影片 · 128 部',state:'partial',stage:'124 部已完成分析，4 部未完成',done:128,total:128,unit:'部',created:'09:05',elapsed:'24 分 16 秒'},
 {id:'subtitle-03',kind:'subtitle',title:'AI 字幕识别与翻译',subject:'漫长的周末 · CD1',file:'DEMO-003.mp4',state:'blocked',stage:'保存字幕受阻',done:1260,total:1260,unit:'条',created:'08:42',elapsed:'26 分 04 秒'},
 {id:'subtitle-04',kind:'subtitle',title:'AI 字幕识别与翻译',subject:'夜航 · CD2',file:'DEMO-004.CD2.mp4',state:'succeeded',stage:'已生成原文字幕、中文字幕与文本',done:1260,total:1260,unit:'条',created:'昨天 21:12',elapsed:'21 分 40 秒'}
];
let jobs=structuredClone(seed),filter='all',kind='all',scenario='normal',detailFilter='issues',lastRoute='',scrollTop=0,toastTimer,dialogReturn;
const states={running:['执行中','run'],queued:['排队中','neutral'],waiting:['等待中','neutral'],blocked:['需处理','warn'],partial:['部分完成','warn'],failed:['失败','warn'],succeeded:['已完成','ok'],cancelled:['已取消','neutral']};
const times={'subtitle-01':['10:25','10:34','10:42','10:42'],'organize-01':['10:31','10:34','10:42','10:42'],'subtitle-02':['','','','10:39'],'organize-02':['09:05','09:11','09:28','09:29'],'subtitle-03':['08:43','08:52','09:07','09:08'],'subtitle-04':['21:13','21:20','21:32','21:34']};
const updated=j=>j.retried?'10:43':times[j.id][3];
const active=j=>['running','queued','waiting'].includes(j.state),attention=j=>['partial','blocked','failed'].includes(j.state),num=n=>n.toLocaleString('zh-CN');
const badge=j=>`<span class="pill ${states[j.state][1]}"><span class="dot"></span>${states[j.state][0]}</span>`;
const taskIcon=j=>`<span class="task-icon ${j.kind}">${icon(j.kind==='subtitle'?'subtitle':'spark')}</span>`;
const progress=(j,big=false)=>`<div class="track ${j.kind==='organize'?'blue':''} ${big?'wide-track':''}" role="progressbar" aria-label="${j.stage}" aria-valuenow="${j.done}" aria-valuemin="0" aria-valuemax="${j.total}"><span style="width:${j.total?Math.round(j.done/j.total*100):0}%"></span></div>`;
const available=()=>scenario!=='offline'&&scenario!=='readonly';
function notify(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3500)}
function modal(title,body,buttons){dialogReturn=document.activeElement;$('#dialog-title').textContent=title;$('#dialog-content').innerHTML=body;$('#dialog-actions').innerHTML=buttons;$('#dialog').showModal()}
function closeModal(){$('#dialog').close()}
$('#dialog').addEventListener('close',()=>{if(dialogReturn?.isConnected)dialogReturn.focus()});
function topNotice(){if(scenario==='offline')return `<div class="notice">${icon('alert')}<div><strong>连接已中断</strong><p>显示 10:42 的最近状态，后台任务是否继续运行需重连后确认。</p></div><button class="btn" data-action="reconnect">重新连接</button></div>`;if(scenario==='readonly')return `<div class="notice neutral">${icon('server')}<div><strong>远程只读</strong><p>可查看任务和成果；取消、重试等操作需在 Server 本机进行。</p></div></div>`;return ''}
function emptyState(mode){const info={empty:['tasks','暂无任务','从影片详情发起字幕生成，或从资料库发起 AI 整理，任务会出现在这里。','返回影片库'],error:['alert','暂时无法加载任务','任务可能仍在后台执行，请稍后重新读取状态。','重新加载'],missing:['file','任务记录不可用','记录可能已被清理，关联成果仍可能存在于影片中。','返回任务中心'],filtered:['tasks','没有匹配的任务','试试其他状态或任务类型。','清除筛选']}[mode];return `<div class="empty-page"><div class="task-icon">${icon(info[0])}</div><h2>${info[1]}</h2><p>${info[2]}</p><button class="btn" data-action="${mode==='error'?'reconnect':mode==='empty'?'library':mode==='missing'?'tasks':'clear-filters'}">${info[3]}</button></div>`}
function taskRow(j){let right= j.state==='running'?`<div class="progress-label"><span>${j.stage}</span><span class="mono">${num(j.done)} / ${num(j.total)} ${j.unit}</span></div>${progress(j)}<div class="row-time">已用时 ${j.elapsed}</div>`:`<p>${j.stage}</p><p class="row-time" style="margin-top:5px">${j.created} · ${j.state==='queued'?'提交':j.state==='succeeded'?`昨天 ${updated(j)} 完成`:`更新于 ${updated(j)}`}</p>`;return `<a class="task-row" href="#/tasks/${j.id}" aria-label="查看${j.subject}的${j.title}详情">${taskIcon(j)}<div><div class="row-title">${j.title}${badge(j)}</div><p class="row-sub">${j.subject}</p></div><div class="row-progress">${right}</div><span class="row-chevron">${icon('arrow')}</span></a>`}
function listPage(){let counts={all:jobs.length,active:jobs.filter(active).length,attention:jobs.filter(attention).length,history:jobs.filter(j=>!active(j)).length};let selected=jobs.filter(j=>(kind==='all'||kind===j.kind)&&(filter==='all'||filter==='active'&&active(j)||filter==='attention'&&attention(j)||filter==='history'&&!active(j)));let body='';
 if(scenario==='empty')body=emptyState('empty');else if(scenario==='error')body=emptyState('error');else if(scenario==='loading')body=`<p class="muted" role="status">正在读取任务…</p>${'<div class="skeleton" aria-hidden="true"></div>'.repeat(4)}`;else if(!selected.length)body=emptyState('filtered');else{for(const [label,predicate]of [['进行中',active],['需要处理',attention],['最近完成',j=>!active(j)&&!attention(j)]]){const group=selected.filter(predicate);if(group.length)body+=`<div class="group-title"><span>${label} <span class="mono">${group.length}</span></span><span>${label==='进行中'?'进度按各自阶段显示':label==='需要处理'?'已有成果保留':'最近记录'}</span></div><div class="task-list">${group.map(taskRow).join('')}</div>`}}
 return `<div class="content"><div class="page-top"><div><p class="eyebrow">WORKSPACE / TASKS</p><h1>任务中心</h1></div><span class="pill server-tag">${icon('server')}本机资料库</span></div>${topNotice()}<div class="toolbar"><div class="tabs" role="group" aria-label="任务状态筛选">${[['all','全部'],['active','进行中'],['attention','需处理'],['history','历史']].map(([k,t])=>`<button class="tab" data-filter="${k}" aria-pressed="${filter===k}">${t}<span class="count">${scenario==='empty'?'0':counts[k]}</span></button>`).join('')}</div><label><span class="sr-only">任务类型</span><select id="kind" class="filter" aria-label="任务类型"><option value="all">所有类型</option><option value="subtitle" ${kind==='subtitle'?'selected':''}>AI 字幕</option><option value="organize" ${kind==='organize'?'selected':''}>AI 整理</option></select></label></div>${body}</div>`;
}
function stages(j){const subtitle=j.kind==='subtitle';let labels=subtitle?['准备与提取音频','识别原文','翻译字幕','保存成果']:['确定处理范围','归纳题材词汇','分类并应用标签','汇总结果'];let current=j.state==='succeeded'||j.state==='partial'?4:j.state==='queued'?(j.retried?(subtitle?3:2):0):j.state==='blocked'?3:2;return `<ol class="stage-list">${labels.map((label,i)=>{let done=i<current,isCurrent=i===current&&j.state!=='queued';let description=done?(subtitle?['音轨 1 · 日语 · 12 个音频分段','已识别 1,260 条原文','中文字幕已完成','3 个文件已保存'][i]:['已固定本次影片范围','共用题材词汇已就绪','已记录每部影片的分析结果','结果已汇总'][i]):isCurrent?(j.state==='blocked'?'目标目录暂时不可写':j.state==='cancelled'?'已停止后续处理':`${j.stage} · ${num(j.done)} / ${num(j.total)} ${j.unit}`):'等待前序阶段完成';return `<li class="stage"><span class="step-circle ${done?'done':isCurrent?'current':''}">${done?icon('check'):i+1}</span><div><h3>${label}</h3><p>${description}</p></div><span class="stage-time">${done?times[j.id][i]:isCurrent?'当前阶段':'待开始'}</span></li>`}).join('')}</ol>`}
function facts(j){return `<div class="panel"><div class="panel-head"><h2>任务信息</h2></div><div class="panel-body"><dl class="meta-list"><div><dt>处理对象</dt><dd>${j.subject}</dd></div>${j.kind==='subtitle'?`<div><dt>视频文件</dt><dd>${j.file}</dd></div><div><dt>语言</dt><dd>日语 → 简体中文</dd></div>`:`<div><dt>本次范围</dt><dd>${j.id==='organize-01'?'发起时未整理的影片':'手动选择的影片'} · ${j.total} 部</dd></div>`}<div><dt>创建时间</dt><dd>2026-10-${j.id==='subtitle-04'?'16':'17'} ${j.created.replace('昨天 ','')}</dd></div><div><dt>${j.state==='queued'?'运行时间':'已用时'}</dt><dd>${j.elapsed}</dd></div><div><dt>任务编号</dt><dd class="mono">${j.id}</dd></div></dl></div><details><summary class="details-summary">模型与执行参数</summary><div class="parameters"><dl class="meta-list">${j.kind==='subtitle'?'<div><dt>识别模型</dt><dd>qwen-audio-3.1-asr-flash-filetrans</dd></div><div><dt>翻译模型</dt><dd>qwen-flash</dd></div><div><dt>音轨</dt><dd>1 · 日语 · AAC 立体声</dd></div>':'<div><dt>文本模型</dt><dd>本次冻结的已配置模型</dd></div><div><dt>处理策略</dt><dd>复用现有题材词汇，逐片应用</dd></div>'}<div><dt>重试次数</dt><dd>${j.retried?'1':'0'}</dd></div></dl></div></details></div>`}
function subtitleResults(j){const completed=j.state==='succeeded';return `<section class="panel"><div class="panel-head"><h2>字幕成果</h2><span class="small muted">${completed?'3 个文件':'尚未保存成品'}</span></div><div class="panel-body">${completed?[['ja.srt','日语原文 · 1,260 条'],['zh-CN.srt','简体中文 · 1,260 条'],['zh-CN.txt','纯文本译文']].map(([name,desc])=>`<div class="file-row">${icon('file')}<div class="file-info"><strong>${name}</strong><p>${desc}</p></div><button class="btn ghost" data-preview="${name}">预览</button></div>`).join(''):`<div class="empty-result">${icon('file')}<span>${j.state==='blocked'?'识别与翻译检查点已保留，解决保存问题后可重试。':j.state==='cancelled'?'本次尚未发布字幕文件，已完成处理保留为临时检查点。':'保存阶段完成后，可在这里查看原文和译文。'}</span></div>`}</div></section>`}
function organizationResults(j){const partial=j.id==='organize-02',failed=partial?4:0,done=partial?116:118,noMatch=8;let issueRows=[['DEMO-018 · 远方的灯','源资料过长，未完成分类。'],['DEMO-042 · 海边车站','模型返回无效分类，未应用变更。'],['DEMO-063 · 晨雾','资料缺少可用于分类的文本。'],['DEMO-107 · 回声','分类结果未通过校验。']];let rows= detailFilter==='issues'?(partial&&!j.retried?issueRows:[]):[['DEMO-006 · 夏日来信','已应用「旅行」「重逢」；依据来自影片简介。'],['DEMO-011 · 湖畔','已应用「日常」；保留已有用户标签。'],['DEMO-023 · 青空','分析完成，未匹配到题材。']];return `<section class="panel"><div class="panel-head"><h2>处理明细</h2><span class="small muted">${j.retried?'继续处理原 4 个问题项':`${j.done} / ${j.total} 部已处理`}</span></div><div class="panel-body"><div class="stats-line"><div class="stat"><strong>${done}</strong><p>已应用标签</p></div><div class="stat"><strong>${noMatch}</strong><p>分析完成 · 无匹配</p></div><div class="stat warn"><strong>${j.retried?'4':failed}</strong><p>${j.retried?'等待重试':'问题影片'}</p></div></div><div class="results-tabs" role="group" aria-label="整理明细筛选"><button data-detail-filter="issues" aria-pressed="${detailFilter==='issues'}">问题影片</button><button data-detail-filter="results" aria-pressed="${detailFilter==='results'}">已完成示例</button></div>${rows.length?rows.map(([title,reason])=>`<div class="item-row"><div><h3>${title}</h3><p>${reason}</p></div><span class="pill ${detailFilter==='issues'?'warn':'ok'}">${detailFilter==='issues'?'未完成':'已分析'}</span></div>`).join(''):`<div class="empty-result">${icon('check')}${j.retried?'4 个问题项已重新排队，原有成功结果保留。':'当前没有需要处理的问题影片。'}</div>`}</div></section>`}
function detailPage(j){if(!j)return `<div class="content">${emptyState('missing')}</div>`;let controls='';if(['running','queued','waiting'].includes(j.state))controls=`<button class="btn danger" data-cancel="${j.id}" ${available()?'':'disabled'}>取消任务</button>`;else if(attention(j))controls=`<button class="btn primary" data-retry="${j.id}" ${available()?'':'disabled'}>${j.kind==='organize'?'重试 4 个问题项':'重试保存'}</button>`;else if(j.state==='succeeded')controls=`<button class="btn" data-action="movie">${icon('film')}查看关联影片</button>`;
 let issue=attention(j)?`<div class="notice">${icon('alert')}<div><strong>${j.kind==='organize'?'4 部影片未完成，其余 124 部已完成分析':'字幕已处理完成，但文件尚未保存'}</strong><p>${j.kind==='organize'?'116 部已应用标签，8 部无匹配。重试只处理问题项。':'目标目录暂时不可写。请检查目录权限后重试保存，现有检查点仍可用。'}</p></div></div>`:'';
 let stateTitle=j.state==='queued'?(j.retried?'等待重试':'正在排队'):j.state==='succeeded'?'任务已完成':j.state==='partial'?'分析结束，有问题项':j.state==='blocked'?'等待处理保存问题':j.state==='cancelled'?'任务已取消':j.stage;
 return `<div class="content"><a class="back" href="#/tasks">${icon('back')}返回任务中心</a><div class="page-top detail-top"><div class="detail-heading">${taskIcon(j)}<div><h1>${j.title}</h1><p class="detail-sub">${j.subject} · ${j.created} 发起</p></div></div>${controls}</div>${topNotice()}${issue}<div class="detail-layout"><div class="stack"><section class="panel"><div class="panel-body"><div class="focus-stage"><div><span class="small muted">${j.state==='running'?'当前阶段':'任务状态'}</span><h2>${stateTitle}</h2>${badge(j)}</div>${j.state==='running'?`<div class="progress-big mono">${num(j.done)} <small>/ ${num(j.total)} ${j.unit}</small></div>`:''}</div>${j.state==='running'?progress(j,true)+`<div class="progress-label muted"><span>本阶段已完成 ${Math.round(j.done/j.total*100)}%</span><span>最近更新 ${updated(j)}</span></div>`:j.state==='queued'?`<p class="small muted">${j.retried?(j.kind==='organize'?'已完成的 124 部保留，仅等待重试 4 个问题项。':'识别与翻译检查点已保留，等待重试保存。'):'等待前一个字幕任务释放处理通道，当前还未开始识别。'}</p>`:''}${stages(j)}</div></section>${j.kind==='subtitle'?subtitleResults(j):organizationResults(j)}<section class="panel"><div class="panel-head"><h2>关键进展</h2><span class="small muted">最近记录</span></div><div class="panel-body">${j.retried?'<div class="event"><time>10:43</time><span>已接受重试，保留此前成功结果。</span></div>':''}<div class="event"><time>${updated(j)}</time><span>${j.state==='cancelled'?'已取消后续处理。':j.stage}</span></div>${j.state==='queued'&&!j.retried?'':`<div class="event"><time>${times[j.id][1]}</time><span>${j.kind==='subtitle'?'原文识别完成。':'题材词汇准备完成。'}</span></div>`}<div class="event"><time>${j.created}</time><span>任务已创建，处理范围已固定。</span></div></div></section></div><aside class="stack details-side">${facts(j)}<div class="panel"><div class="panel-body"><h3>关联内容</h3><p class="small muted" style="margin:8px 0 15px">${j.kind==='subtitle'?j.subject:'本次处理的影片'}</p><button class="btn" data-action="movie">${icon('film')}${j.kind==='subtitle'?'查看影片':'查看影片范围'}</button></div></div></aside></div></div>`;
}
function libraryPage(){return `<div class="content"><div class="page-top"><div><p class="eyebrow">YOUR COLLECTION</p><h1>影片</h1></div><a class="btn" href="#/tasks">${icon('tasks')}查看后台任务</a></div><div class="library-grid">${['山间来信','夏日回声','漫长的周末','夜航'].map((t,i)=>`<div><a href="#/tasks/${['subtitle-01','subtitle-02','subtitle-03','subtitle-04'][i]}" aria-label="查看${t}的字幕任务"><div class="poster" style="filter:hue-rotate(${i*28}deg)"><span>${t}</span></div><div class="poster-meta">${t}<p>DEMO-00${i+1} · 任务演示影片</p></div></a></div>`).join('')}</div></div>`}
function render(){const route=location.hash||'#/tasks',isList=route==='#/tasks',isLibrary=route==='#/library',id=route.split('/')[2];if(lastRoute==='#/tasks'&&!isList)scrollTop=$('#main').scrollTop;$('#crumb').innerHTML=`<a href="#/library">资料库</a><span>/</span><a href="#/tasks" class="${isList?'current':''}">任务中心</a>${id?'<span>/</span><span class="current">任务详情</span>':''}`;if(isLibrary)$('#crumb').innerHTML='<span class="current">资料库 / 影片</span>';
 $('#main').innerHTML=isLibrary?libraryPage():isList?listPage():detailPage(jobs.find(j=>j.id===id));$('#entry-count').textContent=scenario==='empty'?'':`${jobs.filter(j=>j.state==='running').length} 执行中`;$('#entry-meta').textContent=scenario==='empty'?'暂无任务':`${jobs.filter(j=>j.state==='queued').length} 个排队 · ${jobs.filter(j=>j.state==='succeeded').length} 个最近完成`;$('#entry-warning').textContent=scenario==='empty'?'':`${jobs.filter(attention).length} 个任务需要处理`;$('#server-status').textContent=scenario==='offline'?'Server · 连接中断':scenario==='readonly'?'远程 Server · 只读':'本机 Server · 已连接';$('.server-name').textContent=scenario==='readonly'?'远程资料库':'本机资料库';if($('.server-tag'))$('.server-tag').innerHTML=icon('server')+(scenario==='readonly'?'远程资料库':'本机资料库');$('#nav-library').classList.toggle('active',isLibrary);if(route!==lastRoute){$('#main').scrollTop=isList?scrollTop:0;$('#main').focus({preventScroll:true})}lastRoute=route;
}
window.addEventListener('hashchange',render);
$('#scenario').addEventListener('change',e=>{scenario=e.target.value;if(['empty','loading','error'].includes(scenario)&&location.hash!=='#/tasks')location.hash='/tasks';else render()});
$('#reset').addEventListener('click',()=>{jobs=structuredClone(seed);filter='all';kind='all';scenario='normal';detailFilter='issues';$('#scenario').value='normal';scrollTop=0;location.hash='/tasks';render();notify('演示已重置')});
$('#messages').addEventListener('click',()=>modal('消息中心',`<p>AI 整理已结束：124 部完成分析，4 部需要处理。</p><p style="margin-top:12px">09:29 · 本机资料库</p>`,`<button class="btn" data-action="close">关闭</button><button class="btn primary" data-action="message-task">查看任务</button>`));
document.addEventListener('change',e=>{if(e.target.id==='kind'){kind=e.target.value;render();$('#kind').focus()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.filter){filter=b.dataset.filter;render();document.querySelector(`[data-filter="${filter}"]`).focus();return}
 if(b.dataset.detailFilter){detailFilter=b.dataset.detailFilter;render();document.querySelector(`[data-detail-filter="${detailFilter}"]`).focus();return}
 if(b.dataset.cancel){const j=jobs.find(x=>x.id===b.dataset.cancel);modal('取消这个任务？',`<p>停止「${j.subject}」的后续处理。${j.kind==='organize'?'已应用的标签会保留。':'已完成的处理保留为临时检查点，不会删除已有字幕成品。'}</p>`,`<button class="btn" data-action="close">继续执行</button><button class="btn danger" data-confirm-cancel="${j.id}">取消任务</button>`);return}
 if(b.dataset.confirmCancel){const j=jobs.find(x=>x.id===b.dataset.confirmCancel);j.state='cancelled';j.stage='已停止后续处理';closeModal();render();notify('已模拟取消任务，已有结果保留');return}
 if(b.dataset.retry){const j=jobs.find(x=>x.id===b.dataset.retry);j.retried=true;j.state='queued';j.stage=j.kind==='organize'?'问题项等待重试':'等待重试保存';render();notify('已模拟提交重试，原有成果保留');return}
 if(b.dataset.preview){const name=b.dataset.preview;modal(name,`<p>字幕成果预览 · 演示内容</p><pre>${name==='ja.srt'?'1\n00:00:12,400 --> 00:00:15,200\nまた、この場所に戻ってきた。\n\n2\n00:00:18,600 --> 00:00:21,400\nあの日と同じ風が吹いている。':name==='zh-CN.txt'?'我又回到了这个地方。\n风依然像那天一样吹着。':'1\n00:00:12,400 --> 00:00:15,200\n我又回到了这个地方。\n\n2\n00:00:18,600 --> 00:00:21,400\n风依然像那天一样吹着。'}</pre>`,`<button class="btn" data-action="close">关闭预览</button>`);return}
 switch(b.dataset.action){case'close':closeModal();break;case'reconnect':scenario='normal';$('#scenario').value='normal';render();notify('已恢复演示连接');break;case'clear-filters':filter='all';kind='all';render();break;case'library':location.hash='/library';break;case'tasks':location.hash='/tasks';break;case'message-task':closeModal();location.hash='/tasks/organize-02';break;case'movie':location.hash='/library';notify('已返回演示影片库');break;}
});
if(!location.hash)location.hash='/tasks';render();
</script>
</body>
</html>
